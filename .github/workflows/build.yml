name: Build Saity

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # IMPORTANT : le kernel d'abord, il genere libsaity_kernel_stub.a
      # dont le plugin du jeu a besoin pour linker.
      - name: Build kernel plugin
        run: |
          cd kernel
          mkdir -p build && cd build
          cmake ..
          make

      - name: Build game plugin
        run: |
          cd game
          mkdir -p build && cd build
          cmake ..
          make

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: saity
          path: |
            kernel/build/saity_kernel.skprx
            game/build/vitacraft.suprx
